name: Strix Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  strix-security-review:
    name: Strix AI Penetration Testing & Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for diff-scope resolution

      - name: Install Strix CLI
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH

      - name: Run Strix Security Audit
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'openai/gpt-4o' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY secret belum disetel di GitHub Secrets. Untuk mengaktifkan pemindaian AI Strix otomatis pada setiap commit, tambahkan secret LLM_API_KEY (misalnya OpenAI API Key) di menu Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          strix -n -t ./ramu-roastery --scan-mode quick --max-budget 10

      - name: Check Scan Completion
        if: env.LLM_API_KEY != ''
        run: |
          if [ -d "strix_runs" ]; then
            run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
            if [ -n "$run_json" ] && [ -f "$run_json" ]; then
              status=$(jq -r .status "$run_json")
              echo "Strix Run Status: $status"
              if [ "$status" != "completed" ]; then
                echo "::error::Strix run status is '$status' — scan tidak selesai penuh atau budget habis."
                exit 1
              fi
            fi
          fi
